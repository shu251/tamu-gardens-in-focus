name: Sync garden data

on:
  schedule:
    # Fridays 23:30 Central = 04:30 UTC Saturday (CDT, UTC-5) most of the year.
    # Central bounces between UTC-5/UTC-6 with DST; cron always runs in UTC,
    # so this drifts by an hour twice a year -- fine for a weekly sync.
    - cron: "30 4 * * 6"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install slack_sdk openpyxl requests

      - name: Run sync
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/sync_garden_data.py

      - name: Commit updated data
        run: |
          git config user.name "tgif-garden-bot"
          git config user.email "actions@github.com"
          git add data/garden/white_creek_temp.csv data/garden/manifest.json
          git diff --staged --quiet || git commit -m "Weekly garden data sync"
          git push
